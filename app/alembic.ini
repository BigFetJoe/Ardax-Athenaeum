[alembic]
script_location = alembic

# Poe o diretorio atual no caminho de busca do Python.
# Sem isto, o "from ardax.models import ..." dentro do env.py nao encontra nada.
prepend_sys_path = .

# Nome dos arquivos de migracao: numero de ordem + descricao.
# A URL do banco NAO fica aqui -- vem da variavel DATABASE_URL, em env.py.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
