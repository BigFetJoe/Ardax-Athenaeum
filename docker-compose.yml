networks:
  ardax_net:
    name: ardax_net

services:
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: always
    ports:
      - '80:80'
      - '443:443'
      - '127.0.0.1:81:81' # Tranca a porta 81 apenas para o seu túnel SSH
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - ardax_net

  n8n:
    image: n8nio/n8n:latest
    restart: always
    environment:
      - NODE_FUNCTION_ALLOW_EXTERNAL=moment,lodash
      - WEBHOOK_URL= https://n8n.ardax-athenaeum.duckdns.org/
      - N8N_PROXY_HOPS=2

    volumes:
      - n8n_data:/home/node/.n8n
      - ./shared_obsidian:/files/obsidian
    networks:
      - ardax_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  syncthing:
    image: syncthing/syncthing
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - syncthing_data:/var/syncthing
      - ./shared_obsidian:/var/syncthing/Obsidian_Vault
    ports:
      - '22000:22000/tcp' # Necessário para a sincronização P2P de arquivos
      - '22000:22000/udp'
      - '21027:21027/udp'
    networks:
      - ardax_net

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      # Volume nomeado: os dados vivem FORA do container. Apagar o container nao apaga o banco.
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ardax_net
    # Sem "ports": o banco so e' alcancavel de dentro da rede ardax_net.
    # Para acessar do PC, tunel SSH -- nunca abrindo a porta ao mundo.
    healthcheck:
      # O $$ escapa o $: sem isso o Compose tentaria substituir a variavel aqui,
      # em vez de deixar o shell de dentro do container resolve-la.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./app
    restart: always
    environment:
      # Montada a partir das variaveis que ja existem -- nenhum segredo novo.
      # "postgres" e' o nome do servico: dentro da rede do Docker isso vira endereco.
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ardax_net
    # Sem "ports": quem publica para fora e' o Nginx Proxy Manager, no A3.

  discord-bridge:
    build: ./disc-bridge
    # (build: ./discord-bridge indica ao Compose que ele deve entrar nessa subpasta para procurar o Dockerfile)
    container_name: discord_n8n_bridge
    restart: always
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
    depends_on:
      - n8n
    # (depends_on garante a ordem de inicialização: o bot só sobe após o container do n8n já estar ativo)
    networks:
      - ardax_net

volumes:
  npm_data:
  npm_letsencrypt:
  n8n_data:
  syncthing_data:
  postgres_data:
